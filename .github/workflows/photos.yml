# When a photo is uploaded to assets/photos/, make web sizes (WebP, 640–3840px) and update the manifest,
# then commit them back so the site shows the photo. See PHOTOS.md.
name: Photos

on:
  push:
    branches: [main]
    paths:
      - 'assets/photos/*.jpg'
      - 'assets/photos/*.jpeg'
      - 'assets/photos/*.png'
      - 'assets/photos/*.JPG'
      - 'assets/photos/*.JPEG'
      - 'assets/photos/*.PNG'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  web-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sharp
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Make web sizes
        run: node tools/photos.mjs

      - name: Commit web sizes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/photos/web assets/photos/manifest.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Photos: web sizes"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the workflow token don't always start a Pages build, so ask for one.
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
